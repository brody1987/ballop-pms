<!DOCTYPE html>
<html lang="en" class="dark">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
            },
            colors: {
              primary: {
                DEFAULT: "#135bec", // The blue from the image
                hover: "#0f4bc0",
                light: "#E3E9FA"
              },
              dark: {
                bg: "#101622",
                surface: "#1C2433",
                border: "#2A3441"
              },
              status: {
                success: "#10B981",
                warning: "#F59E0B",
                danger: "#EF4444",
                info: "#3B82F6"
              }
            },
          },
        },
      };
    </script>
    <style>

        }

            background: #101622; 
        }
        ::-webkit-scrollbar-thumb {
            background: #2A3441; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #374151; 
        }
    </style>
